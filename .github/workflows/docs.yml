name: Deploy Documentation

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write

# Constant group (deliberately not per-ref): a release pushes both `main` and
# the tag, triggering two runs that otherwise race to push `gh-pages`. Serialize
# them so the second re-fetches and pushes on top instead of being rejected.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch git tags and gh-pages branch
        run: |
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*
          git fetch origin gh-pages --depth=1

      - name: Deploy docs with mike
        run: |
          # Extract version from pyproject.toml
          VERSION=$(poetry version -s)

          # Check if current commit is tagged (indicates a release)
          if TAG=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            # Remove 'v' prefix if present for version check
            TAG_VERSION="${TAG#v}"

            # Check if this is a pre-release (alpha, beta, rc, dev)
            if [[ "$TAG_VERSION" =~ (a|alpha|b|beta|rc|dev) ]]; then
              echo "🧪 Deploying pre-release version: $VERSION"
              # Deploy to version-specific alias WITHOUT updating 'latest'
              poetry run mike deploy --push $VERSION
            else
              echo "📦 Deploying stable release version: $VERSION"
              # Deploy to version-specific alias and update 'latest'
              poetry run mike deploy --push --update-aliases $VERSION latest
              # Set 'latest' as the default version
              poetry run mike set-default --push latest
            fi
          else
            echo "🚧 Deploying development version: dev"
            # Deploy to 'dev' for unreleased changes
            poetry run mike deploy --push dev
          fi
